<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#13181d">
<title>Bullion rates, Nepal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13181d; --panel:#1a2128; --panel2:#212a33; --line:#2a333d; --text:#e8eaed; --mute:#8b97a4;
  --gold:#e2b658; --silver:#b6c4d3; --up:#62c28c; --down:#e5706b; --warn:#e2b658;
  --pad:clamp(12px,2.2vw,24px);
  --font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:62px;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* top bar */
.bar{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--mute);font-size:12.5px}
.status{margin-left:auto;text-align:right;font-size:12.5px;color:var(--mute);line-height:1.45}
.status b{color:var(--text);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--warn)}

/* nav */
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;order:2}
.tabs button{display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:0;border-radius:7px;padding:7px 16px;color:var(--mute);font-weight:500;min-height:36px}
.tabs button[aria-selected=true]{background:#2a343f;color:var(--text)}
.tabs svg{width:18px;height:18px;flex:none}

/* views */
.view{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px var(--pad);display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--mute);font-size:13px;font-weight:500;min-height:32px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#2a343f;color:var(--text)}
.note{font-size:12.5px;color:var(--mute)}

/* rate cards */
.cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:12px}
.card{--c:var(--gold);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.card[data-metal=silver]{--c:var(--silver)}
.head{display:flex;align-items:baseline;gap:10px}
h2{font-size:15px;font-weight:600;color:var(--c)}
.purity{font-size:12px;color:var(--mute)}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:4px}
.cur{font-size:15px;color:var(--mute)}
.val{font-size:clamp(30px,4.6vw,54px);font-weight:700;letter-spacing:-.02em;line-height:1.08}
.per{font-size:14px;color:var(--mute)}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px;font-size:13px;color:var(--mute)}
.chg{font-weight:600}.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.chart{position:relative;flex:1;min-height:220px;margin:10px -4px 0;touch-action:pan-y;cursor:crosshair}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:13px}
.tip{position:absolute;pointer-events:none;background:#0f1418;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .08s;z-index:2}
.tip small{display:block;color:var(--mute);font-size:11.5px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 14px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}

/* products */
.filters{position:sticky;top:-14px;z-index:5;background:var(--bg);margin:-14px calc(var(--pad) * -1) 0;padding:12px var(--pad) 10px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-bottom:1px solid var(--line)}
.search{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px}
.search::placeholder{color:var(--mute)}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.count{font-size:12.5px;color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pcard:hover{border-color:#3b4753}
.pimg{aspect-ratio:1;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.ph{font-size:34px;font-weight:600;color:var(--mute)}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pname{font-weight:600;line-height:1.25}
.pmeta{font-size:12.5px;color:var(--mute)}
.pprice{margin-top:4px;font-weight:600;font-size:14px}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.mdot.gold{background:var(--gold)}.mdot.silver{background:var(--silver)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 10px}
.empty button{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.skel{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* product sheet */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0;border-radius:14px;width:min(780px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(6,9,12,.7)}
.x{position:absolute;top:8px;right:8px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(19,24,29,.85);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.sh{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);overflow:auto;max-height:inherit}
.shimg{background:var(--panel2);display:grid;place-items:center;aspect-ratio:1;align-self:start;position:sticky;top:0}
.shimg img{width:100%;height:100%;object-fit:contain}
.shinfo{padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-width:0}
h3{font-size:20px;font-weight:600;line-height:1.2;padding-right:36px}
.tags{font-size:13px;color:var(--mute)}
.desc{font-size:14px;color:#c4ccd4;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto;padding:2px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;min-height:34px}
.chips button[aria-checked=true]{border-color:var(--gold);background:#2a343f}
.bd{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
.bd dt{color:var(--mute)}.bd dd{text-align:right;margin:0}
.bd .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:16px;color:var(--text)}
.bd dt.tot{color:var(--text)}

/* nav placement: phones and small tablets use a bottom bar */
@media (max-width:879px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;border-width:1px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;background:var(--panel)}
  .tabs button{flex:1;flex-direction:column;gap:2px;font-size:12px;min-height:46px}
  .view{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px)}
  .filters{top:-14px}
}
@media (min-width:700px){
  .cards{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
}
/* desktop: whole rates screen fits the viewport */
@media (min-width:880px) and (min-height:640px){
  #v-rates{overflow:hidden}
  .tabs{order:0;margin-left:8px}
}
@media (min-width:880px){ .tabs{order:0;margin-left:8px} }
@media (min-width:1500px){ body{font-size:16px} .card{padding:22px 22px 14px} .val{font-size:clamp(46px,3.6vw,68px)} }
/* phones */
@media (max-width:520px){
  .bar{gap:6px 12px} .status .wide{display:none}
  .card{padding:14px 14px 8px}
  .chart{min-height:230px}
  .sh{grid-template-columns:1fr}
  .shimg{position:relative;aspect-ratio:4/3}
  dialog{margin:auto 0 0;width:100%;border-radius:16px 16px 0 0;max-height:92dvh;border-bottom:0}
}
@media (pointer:coarse){ .seg button{min-height:40px;padding:6px 14px} .chips button{min-height:40px} }
/* short landscape screens */
@media (max-height:520px) and (orientation:landscape){
  .tabs{position:static;order:0;border-radius:10px;border-width:1px;padding:3px;background:var(--panel)}
  .tabs button{flex-direction:row;font-size:14px;min-height:34px}
  .view{padding-bottom:14px}
  .cards{grid-template-columns:1fr 1fr}
  .chart{min-height:150px}
  .val{font-size:30px}
  .bar{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div><h1>Bullion rates</h1><p class="sub">Nepal, prices in NPR</p></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="t-rates" aria-controls="v-rates" aria-selected="true" data-view="rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 8-9"/><path d="M3 21h18"/></svg>Rates</button>
      <button role="tab" id="t-products" aria-controls="v-products" aria-selected="false" data-view="products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Products</button>
    </nav>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <section class="view" id="v-rates" role="tabpanel" aria-labelledby="t-rates">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Price unit">
        <button data-unit="tola" aria-pressed="true">Per tola</button>
        <button data-unit="g10" aria-pressed="false">Per 10 g</button>
      </div>
      <div class="seg" role="group" aria-label="Chart range">
        <button data-range="7d" aria-pressed="true">7 days</button>
        <button data-range="1m" aria-pressed="false">1 month</button>
      </div>
    </div>
    <div class="cards">
      <section class="card" data-metal="gold" aria-label="Gold">
        <div class="head"><h2>Gold</h2><span class="purity"></span></div>
        <div class="price"><span class="cur">NPR</span><span class="val">...</span><span class="per"></span></div>
        <div class="meta"><span class="chg"></span><span class="alt"></span></div>
        <div class="chart"></div>
        <div class="foot"><span class="lh"></span><span class="pub"></span></div>
      </section>
      <section class="card" data-metal="silver" aria-label="Silver">
        <div class="head"><h2>Silver</h2><span class="purity"></span></div>
        <div class="price"><span class="cur">NPR</span><span class="val">...</span><span class="per"></span></div>
        <div class="meta"><span class="chg"></span><span class="alt"></span></div>
        <div class="chart"></div>
        <div class="foot"><span class="lh"></span><span class="pub"></span></div>
      </section>
    </div>
    <p class="note" id="rnote"></p>
  </section>

  <section class="view" id="v-products" role="tabpanel" aria-labelledby="t-products" hidden>
    <div class="filters">
      <input class="search" id="q" type="search" placeholder="Search products" aria-label="Search products" autocomplete="off">
      <div class="seg" role="group" aria-label="Metal" id="f-metal">
        <button data-v="all" aria-pressed="true">All</button><button data-v="gold" aria-pressed="false">Gold</button><button data-v="silver" aria-pressed="false">Silver</button>
      </div>
      <div class="seg" role="group" aria-label="Collection" id="f-line">
        <button data-v="all" aria-pressed="true">Any</button><button data-v="hbc_bullion" aria-pressed="false">Bullion</button><button data-v="hbc_azaya" aria-pressed="false">Azaya</button>
      </div>
      <select id="sort" aria-label="Sort products">
        <option value="name">Name A to Z</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<dialog id="sheet" aria-label="Product details"></dialog>

<script>
const BASE = 'https://app.himalayanbullion.com/api/v1';
const URLS = {
  rates: BASE + '/market/rates',
  hist: (m, r) => `${BASE}/market/rate-history?metal=${m}&range=${r}`,
  cat: BASE + '/catalogue'
};
const TOLA_G = 11.6638;          // grams per tola
const REFRESH_MS = 60000, HIST_MS = 300000;

/* ---------- saved copy, used only when a live request fails ---------- */
const SNAP = {
  serverNow: '2026-10-12T06:49:13Z',
  rates: {
    gold:   { pub:'2026-10-12T05:10:08Z', G:252400, T:294400, purity:'24K, .9999 fine' },
    silver: { pub:'2026-10-12T05:10:08Z', G:3785,   T:4415,   purity:null }
  },
  dates: ['09-13','09-14','09-15','09-16','09-17','09-18','09-20','09-21','09-22','09-23','09-24','09-25','09-26','09-27','09-28','09-29','09-30','10-01','10-02','10-04','10-05','10-06','10-07','10-08','10-09','10-11','10-12'],
  gold:   [259090,258060,257290,258745,256775,259860,261660,260545,259090,259090,256430,260000,260000,256600,252315,253455,251460,251460,252745,250255,249915,249915,250600,251030,253515,254200,252400],
  silver: [3995.5,3961,3944,4016.5,3965,4094,4111,4119.5,4094,4094,3986.5,4000,4000,3991,3866.5,3900,3794,3794,3815,3764,3798,3785,3794,3764,3776.5,3806.5,3785]
};

const S = {
  view:'rates', unit:'tola', range:'7d',
  rates:null, hist:{gold:{},silver:{}},
  srcRates:'loading', srcHist:'loading',
  offset:0, nextAt:Date.now()+REFRESH_MS,
  cat:null, catState:'idle',
  f:{q:'',metal:'all',line:'all',sort:'name'},
  openKey:null, variant:null
};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const dfDay = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kathmandu',day:'numeric',month:'short'});
const dfTime = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kathmandu',hour:'2-digit',minute:'2-digit',hour12:false});
const now = () => Date.now() + S.offset;
const stamp = t => `${dfDay.format(t)}, ${dfTime.format(t)}`;
function ago(t){
  const m = Math.max(0, Math.round((now()-t)/60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + ' h ' + (m%60) + ' min ago';
  const d = Math.floor(h/24); return d + (d===1?' day':' days') + ' ago';
}
async function getJSON(url, ms=10000){
  const c = new AbortController(), to = setTimeout(()=>c.abort(), ms);
  try{
    const r = await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error('API returned ok:false');
    return j.data;
  } finally { clearTimeout(to); }
}
const val = (p, u=S.unit) => u === 'tola' ? p.g * TOLA_G / 10 : p.g;
const unitLabel = u => u === 'tola' ? 'per tola' : 'per 10 g';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const pct = p => (+p * 100).toFixed(2).replace(/\.?0+$/, '');

/* ---------- data: rates and history ---------- */
function ratesFromApi(d){
  const out = {};
  d.metals.forEach(m => out[m.metal] = { pub:Date.parse(m.publishedAt), G:+m.nprPer10g, T:+m.nprPerTola, purity:m.purityLabel });
  return out;
}
function ratesFromSnap(){
  const o = {}; for (const k in SNAP.rates){ const r = SNAP.rates[k]; o[k] = {pub:Date.parse(r.pub),G:r.G,T:r.T,purity:r.purity}; } return o;
}
const histFromApi = d => d.points.map(p => ({
  date:p.effectiveDate, t:Date.parse(p.effectiveDate + 'T00:00:00+05:45'), g:+p.nprPer10g, src:p.attribution
}));
function histFromSnap(metal, range){
  const all = SNAP.dates.map((d,i) => ({
    date:'2026-' + d, t:Date.parse('2026-' + d + 'T00:00:00+05:45'), g:SNAP[metal][i], src:i < 9 ? 'FENEGOSIDA' : 'HBC'
  }));
  return range === '7d' ? all.slice(-7) : all;
}

async function loadRates(){
  try{
    const d = await getJSON(URLS.rates);
    S.rates = ratesFromApi(d); S.srcRates = 'live';
    if (d.serverNow) S.offset = Date.parse(d.serverNow) - Date.now();
  }catch(e){
    console.warn('Rates request failed:', e);
    if (!S.rates || S.srcRates !== 'live'){ S.rates = ratesFromSnap(); S.offset = 0; }
    S.srcRates = 'saved';
  }
  S.nextAt = Date.now() + REFRESH_MS;
  render();
  if (S.catState === 'idle') setTimeout(loadCatalogue, 1200);
}
async function loadHist(){
  const jobs = [];
  for (const m of ['gold','silver']) for (const r of ['7d','1m']) jobs.push([m, r]);
  const res = await Promise.allSettled(jobs.map(([m,r]) => getJSON(URLS.hist(m,r))));
  let failed = 0;
  res.forEach((x,i) => {
    const [m,r] = jobs[i];
    if (x.status === 'fulfilled' && x.value.points?.length) S.hist[m][r] = histFromApi(x.value);
    else { failed++; console.warn('History request failed:', m, r, x.reason); if (!S.hist[m][r]) S.hist[m][r] = histFromSnap(m, r); }
  });
  S.srcHist = failed ? 'saved' : 'live';
  render();
}

/* ---------- data: catalogue ---------- */
async function loadCatalogue(){
  if (S.catState === 'loading') return;
  S.catState = 'loading'; renderProducts();
  try{
    const d = await getJSON(URLS.cat, 20000);
    S.cat = groupProducts(d.products || []);
    S.catState = 'ready';
  }catch(e){ console.warn('Catalogue request failed:', e); S.catState = 'error'; }
  renderProducts();
}
function groupProducts(list){
  const map = new Map();
  for (const p of list){
    const key = [p.metal, p.productLine, String(p.name).trim().toLowerCase(), p.primaryImage?.url || ''].join('|');
    let g = map.get(key);
    if (!g){ g = {key, metal:p.metal, line:p.productLine, form:p.form, name:cap(String(p.name).trim()), desc:p.description, img:p.primaryImage, variants:[]}; map.set(key, g); }
    g.variants.push(p);
  }
  const groups = [...map.values()];
  groups.forEach(g => g.variants.sort((a,b) => +a.denominationG - +b.denominationG));
  return groups;
}
const lineName = l => ({hbc_bullion:'Bullion', hbc_azaya:'Azaya'}[l] || cap(String(l||'').replace(/^hbc_/,'')));
/* Estimate: metal value (weight x purity x current rate per gram), making charge as a
   share of metal value, plus flat fees. Percentage fees are listed but not added. */
function est(v){
  const r = S.rates && S.rates[v.metal]; if (!r) return null;
  const metal = (+v.denominationG) * (+v.physicalPurity) * (r.G / 10);
  const making = metal * ((+v.makingChargeBp || 0) / 10000);
  let flat = 0; const flatFees = [], pctFees = [];
  (v.fees || []).forEach(f => {
    if (f.calculationType === 'flat_npr' && f.flatAmountNpr){ flat += +f.flatAmountNpr; flatFees.push(f); }
    else pctFees.push(f);
  });
  return {metal, making, flat, flatFees, pctFees, total: metal + making + flat};
}

/* ---------- rates view ---------- */
function renderRates(){
  const noteBits = [`Tola values in the charts are converted from per 10 g rates at ${TOLA_G} g per tola.`];
  if (S.srcHist === 'saved') noteBits.push('Chart data is a saved copy because the history request failed.');
  $('#rnote').textContent = noteBits.join(' ');
  $$('.card').forEach(card => {
    const key = card.dataset.metal, m = S.rates && S.rates[key], pts = S.hist[key][S.range];
    const chart = $('.chart', card);
    if (!m){ chart._d = null; chart.innerHTML = '<div class="msg">Loading rates</div>'; return; }
    const u = S.unit, other = u === 'tola' ? 'g10' : 'tola';
    $('.purity', card).textContent = m.purity || '';
    $('.val', card).textContent = nf.format(u === 'tola' ? m.T : m.G);
    $('.per', card).textContent = unitLabel(u);
    $('.alt', card).textContent = `NPR ${nf.format(other === 'tola' ? m.T : m.G)} ${unitLabel(other)}`;
    $('.pub', card).textContent = `Published ${stamp(m.pub)} NPT`;
    if (!pts || !pts.length){ chart._d = null; chart.innerHTML = '<div class="msg">Loading history</div>'; return; }
    const first = pts[0], last = pts[pts.length-1];
    const diff = val(last) - val(first), p = diff / val(first) * 100;
    const chg = $('.chg', card);
    chg.className = 'chg ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
    chg.textContent = `${diff>0?'+':diff<0?'-':''}${nf.format(Math.abs(diff))} (${p>0?'+':''}${nf2.format(p)}%) in ${S.range === '7d' ? '7 days' : '1 month'}`;
    const vs = pts.map(x => val(x));
    $('.lh', card).textContent = `Low ${nf.format(Math.min(...vs))}, high ${nf.format(Math.max(...vs))}`;
    chart._d = {pts, color:getComputedStyle(card).getPropertyValue('--c').trim()};
    drawChart(chart);
  });
}
function drawChart(el){
  const d = el._d; if (!d) return;
  const W = el.clientWidth, H = el.clientHeight; if (W < 60 || H < 60) return;
  const pts = d.pts, u = S.unit, c = d.color;
  const m = {l: W < 420 ? 50 : 60, r:12, t:10, b:24};
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const vs = pts.map(p => val(p,u));
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo || hi * .01) * .18; lo -= pad; hi += pad;
  const x = t => m.l + (t - t0) / ((t1 - t0) || 1) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  let g = '';
  for (let i = 0; i < 4; i++){
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="#2a333d"/>`+
         `<text x="${m.l-8}" y="${yy+4}" text-anchor="end" fill="#8b97a4" font-size="11">${nf.format(v)}</text>`;
  }
  const nT = W < 420 ? 3 : 5;
  for (let i = 0; i < nT; i++){
    const t = t0 + (t1 - t0) * i / (nT - 1), a = i === 0 ? 'start' : i === nT-1 ? 'end' : 'middle';
    g += `<text x="${x(t)}" y="${H-6}" text-anchor="${a}" fill="#8b97a4" font-size="11">${dfDay.format(t)}</text>`;
  }
  const line = pts.map((p,i) => (i?'L':'M') + x(p.t).toFixed(1) + ' ' + y(val(p,u)).toFixed(1)).join('');
  const area = line + `L${x(t1)} ${H-m.b}L${x(t0)} ${H-m.b}Z`;
  const dots = pts.length <= 14 ? pts.map(p => `<circle cx="${x(p.t)}" cy="${y(val(p,u))}" r="2.5" fill="${c}"/>`).join('') : '';
  const lp = pts[pts.length-1];
  el.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history chart">${g}`+
    `<path d="${area}" fill="${c}" opacity=".08"/>`+
    `<path d="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`+
    `<circle cx="${x(lp.t)}" cy="${y(val(lp,u))}" r="4.5" fill="${c}" stroke="#1a2128" stroke-width="2"/>`+
    `<line class="cx" y1="${m.t}" y2="${H-m.b}" stroke="#8b97a4" stroke-dasharray="3 3" opacity="0"/>`+
    `<circle class="cd" r="5" fill="#1a2128" stroke="${c}" stroke-width="2" opacity="0"/></svg><div class="tip"></div>`;
  const svg = $('svg', el), tip = $('.tip', el), cx = $('.cx', svg), cd = $('.cd', svg);
  const hide = () => { tip.style.opacity = 0; cx.setAttribute('opacity',0); cd.setAttribute('opacity',0); };
  const move = e => {
    const px = e.clientX - el.getBoundingClientRect().left;
    let best = pts[0], bd = Infinity;
    pts.forEach(p => { const dd = Math.abs(x(p.t) - px); if (dd < bd){ bd = dd; best = p; } });
    const bx = x(best.t), by = y(val(best,u));
    cx.setAttribute('x1',bx); cx.setAttribute('x2',bx); cx.setAttribute('opacity',1);
    cd.setAttribute('cx',bx); cd.setAttribute('cy',by); cd.setAttribute('opacity',1);
    tip.innerHTML = `NPR ${nf.format(val(best,u))}<small>${esc(dfDay.format(best.t))}${best.src ? ', source ' + esc(best.src) : ''}</small>`;
    tip.style.opacity = 1;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(bx - tw/2, 0), W - tw) + 'px';
    tip.style.top = Math.max(by - tip.offsetHeight - 12, 0) + 'px';
  };
  el.onpointermove = move; el.onpointerdown = move; el.onpointerleave = hide; el.onpointercancel = hide;
}
const ro = new ResizeObserver(es => es.forEach(e => drawChart(e.target)));
$$('.chart').forEach(c => ro.observe(c));

/* ---------- products view ---------- */
function groupPrice(g){
  const t = g.variants.map(v => est(v)).filter(Boolean).map(e => e.total);
  return t.length ? Math.min(...t) : null;
}
function imgHTML(g, big){
  const i = g.img;
  if (i && /^https:\/\//.test(i.url || ''))
    return `<img src="${esc(i.url)}" alt="${esc(i.alt || g.name)}" ${big ? '' : 'loading="lazy" decoding="async"'} width="${+i.width||960}" height="${+i.height||960}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${esc(g.name.charAt(0))}'}))">`;
  return `<span class="ph">${esc(g.name.charAt(0))}</span>`;
}
function filteredGroups(){
  const {q, metal, line, sort} = S.f, needle = q.trim().toLowerCase();
  let list = (S.cat || []).filter(g =>
    (metal === 'all' || g.metal === metal) && (line === 'all' || g.line === line) &&
    (!needle || [g.name, g.desc, lineName(g.line), g.metal, ...g.variants.map(v => v.sku + ' ' + v.label)].join(' ').toLowerCase().includes(needle)));
  if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name) || a.metal.localeCompare(b.metal));
  else {
    const pr = g => groupPrice(g) ?? Infinity;
    list.sort((a,b) => sort === 'low' ? pr(a) - pr(b) : (pr(b) === Infinity ? -1 : pr(b)) - (pr(a) === Infinity ? -1 : pr(a)));
  }
  return list;
}
function renderProducts(){
  const grid = $('#grid'), count = $('#count');
  if (S.catState === 'loading' || S.catState === 'idle'){
    count.textContent = ''; grid.innerHTML = Array.from({length:8}, () => '<div class="skel"></div>').join(''); return;
  }
  if (S.catState === 'error'){
    count.textContent = '';
    grid.innerHTML = '<div class="empty">The catalogue did not load. Check your connection, then try again.<br><button id="retry">Try again</button></div>';
    return;
  }
  const list = filteredGroups();
  count.textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;
  if (!list.length){
    grid.innerHTML = '<div class="empty">No products match these filters.<br><button id="clear">Clear filters</button></div>'; return;
  }
  grid.innerHTML = list.map(g => {
    const n = g.variants.length, p = groupPrice(g);
    const purs = [...new Set(g.variants.map(v => pct(v.physicalPurity)))];
    const meta = `<span class="mdot ${esc(g.metal)}"></span>${esc(cap(g.metal))}, ${purs.length > 1 ? purs[0] + ' to ' + purs[purs.length-1] : purs[0]}%`;
    const size = n > 1 ? `${n} sizes` : esc(g.variants[0].label);
    return `<button class="pcard" data-key="${esc(g.key)}" aria-label="${esc(g.name)}">
      <div class="pimg">${imgHTML(g)}</div>
      <div class="pbody"><div class="pname">${esc(g.name)}</div><div class="pmeta">${meta}</div><div class="pmeta">${size}</div>
      <div class="pprice">${p == null ? '' : (n > 1 ? 'From ' : '') + 'NPR ' + nf.format(p)}</div></div></button>`;
  }).join('');
}
function sheetHTML(g, v){
  const e = est(v);
  const row = (k, val, cls='') => `<dt class="${cls}">${k}</dt><dd class="${cls}">${val}</dd>`;
  let rows = row('Weight', esc(v.label)) + row('Purity', pct(v.physicalPurity) + '%');
  if (e){
    rows += row('Metal value', 'NPR ' + nf.format(e.metal));
    if (+v.makingChargeBp) rows += row(`Making charge (${nf2.format(v.makingChargeBp / 100)}%)`, 'NPR ' + nf.format(e.making));
    e.flatFees.forEach(f => rows += row(esc(f.customerLabel), 'NPR ' + nf.format(+f.flatAmountNpr)));
    e.pctFees.forEach(f => rows += row(esc(f.customerLabel || 'Fee'), f.percentageBasisPoints ? nf2.format(f.percentageBasisPoints/100) + '% (not in estimate)' : 'Not in estimate'));
    rows += row('Estimated total', 'NPR ' + nf.format(e.total), 'tot');
  } else rows += row('Price', 'Waiting for live rates');
  (v.giftBoxes || []).forEach(b => rows += row(esc(b.name || 'Gift box') + ' (optional)', '+ NPR ' + nf.format(+b.unitPriceNpr)));
  const chips = g.variants.length > 1
    ? `<div class="chips" role="radiogroup" aria-label="Size">${g.variants.map(x => `<button role="radio" aria-checked="${x.variantId === v.variantId}" data-vid="${esc(x.variantId)}">${esc(x.label)}</button>`).join('')}</div>` : '';
  const tags = [cap(g.metal), lineName(g.line), g.form ? cap(g.form) : null].filter(Boolean).join(', ');
  return `<button class="x" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="sh"><div class="shimg">${imgHTML(g, true)}</div>
    <div class="shinfo"><h3>${esc(g.name)}</h3><p class="tags">${esc(tags)}</p>
    ${g.desc ? `<p class="desc">${esc(g.desc)}</p>` : ''}${chips}
    <dl class="bd">${rows}</dl>
    <p class="note">An estimate, not a quote: weight x purity x the current rate, plus making charge on the metal value and any listed flat fees. Confirm the final price with Himalayan Bullion.</p></div></div>`;
}
function renderSheet(){
  const dlg = $('#sheet'); if (!dlg.open || !S.cat) return;
  const g = S.cat.find(x => x.key === S.openKey); if (!g) return;
  const v = g.variants.find(x => x.variantId === S.variant) || g.variants[0];
  S.variant = v.variantId;
  const sc = $('.sh', dlg)?.scrollTop || 0;
  dlg.innerHTML = sheetHTML(g, v);
  const sh = $('.sh', dlg); if (sh) sh.scrollTop = sc;
}
function openSheet(key){
  const g = S.cat.find(x => x.key === key); if (!g) return;
  S.openKey = key; S.variant = g.variants[0].variantId;
  $('#sheet').showModal(); renderSheet();
}

/* ---------- status, view switching, render ---------- */
function tick(){
  const s = $('#status');
  if (!S.rates){ s.innerHTML = '<span class="dot off"></span><b>Loading</b>'; return; }
  const newest = Math.max(...Object.values(S.rates).map(r => r.pub));
  const left = Math.max(0, Math.ceil((S.nextAt - Date.now()) / 1000));
  const clock = dfTime.format(now());
  s.innerHTML = S.srcRates === 'live'
    ? `<span class="dot"></span><b>Live</b> ${clock} NPT<br>Rates published ${ago(newest)}<span class="wide">, next check in ${left} s</span>`
    : `<span class="dot off"></span><b>Saved copy</b>, live request failed<br>Rates from ${stamp(newest)}<span class="wide">, retry in ${left} s</span>`;
}
function render(){ renderRates(); if (S.view === 'products'){ renderProducts(); } else if (S.catState === 'ready'){ renderProducts(); } renderSheet(); tick(); }
function setView(v, push){
  S.view = v;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
  $('#v-rates').hidden = v !== 'rates'; $('#v-products').hidden = v !== 'products';
  if (push) history.replaceState(null, '', '#' + v);
  if (v === 'products'){ if (S.catState === 'idle' || S.catState === 'error') loadCatalogue(); else renderProducts(); }
  else requestAnimationFrame(() => $$('.chart').forEach(drawChart));
}

/* ---------- events ---------- */
$$('.tabs button').forEach(b => b.onclick = () => setView(b.dataset.view, true));
addEventListener('hashchange', () => setView(location.hash === '#products' ? 'products' : 'rates'));
$$('[data-unit]').forEach(b => b.onclick = () => { S.unit = b.dataset.unit; $$('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
$$('[data-range]').forEach(b => b.onclick = () => { S.range = b.dataset.range; $$('[data-range]').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
function bindSeg(id, key){
  $$('#' + id + ' button').forEach(b => b.onclick = () => {
    S.f[key] = b.dataset.v; $$('#' + id + ' button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderProducts();
  });
}
bindSeg('f-metal','metal'); bindSeg('f-line','line');
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.f.q = e.target.value; renderProducts(); }, 120); };
$('#sort').onchange = e => { S.f.sort = e.target.value; renderProducts(); };
$('#grid').onclick = e => {
  const card = e.target.closest('.pcard'); if (card) return openSheet(card.dataset.key);
  if (e.target.id === 'retry') return loadCatalogue();
  if (e.target.id === 'clear'){
    S.f = {q:'',metal:'all',line:'all',sort:S.f.sort}; $('#q').value = '';
    $$('#f-metal button, #f-line button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'all')); renderProducts();
  }
};
$('#sheet').addEventListener('click', e => {
  const dlg = e.currentTarget;
  if (e.target === dlg || e.target.closest('[data-close]')) return dlg.close();
  const chip = e.target.closest('[data-vid]'); if (chip){ S.variant = chip.dataset.vid; renderSheet(); }
});

/* ---------- start ---------- */
setView(location.hash === '#products' ? 'products' : 'rates');
setInterval(tick, 1000);
setInterval(loadRates, REFRESH_MS);
setInterval(loadHist, HIST_MS);
loadRates(); loadHist();
</script>
</body>
